<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="../restaurante 2/restaurante/css/style.css">

    <title>Formulario de Registro</title>

</head>

<body>

<div class="contenedor">

    <h2>Registro de Usuario</h2>

    <form>

        <!-- Nombre -->
        <div class="grupo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">
        </div>


        <!-- Apellido -->
        <div class="grupo">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido">
        </div>


        <!-- Tipo Documento -->
        <div class="grupo">
            <label for="tipoDocumento">Tipo de Documento</label>

            <select id="tipoDocumento" name="tipoDocumento">

                <option value="">Seleccione</option>
                <option value="CC">Cédula de Ciudadanía</option>
                <option value="TI">Tarjeta de Identidad</option>
                <option value="CE">Cédula de Extranjería</option>
                <option value="Pasaporte">Pasaporte</option>

            </select>

        </div>


        <!-- Número Documento -->
        <div class="grupo">

            <label for="numeroDocumento">
                Número de Documento
            </label>

            <input 
            type="text" 
            id="numeroDocumento" 
            name="numeroDocumento">

        </div>


        <!-- Teléfono -->
        <div class="grupo">

            <label for="telefono">
                Teléfono
            </label>

            <input 
            type="tel" 
            id="telefono" 
            name="telefono">

        </div>


        <!-- Correo -->
        <div class="grupo">

            <label for="correo">
                Correo Electrónico
            </label>

            <input 
            type="email" 
            id="correo" 
            name="correo">

        </div>


        <!-- Género -->
        <div class="grupo">

            <label for="genero">
                Género
            </label>

            <select id="genero" name="genero">

                <option value="">
                    Seleccione
                </option>

                <option value="Masculino">
                    Masculino
                </option>

                <option value="Femenino">
                    Femenino
                </option>

                <option value="Otro">
                    Otro
                </option>

            </select>

        </div>


        <!-- Cargo -->
        <div class="grupo">

            <label for="cargo">
                Cargo
            </label>

            <input 
            type="text" 
            id="cargo" 
            name="cargo">

        </div>


        <!-- Fecha -->
        <div class="grupo">

            <label for="fechaNacimiento">
                Fecha de Nacimiento
            </label>

            <input 
            type="date" 
            id="fechaNacimiento" 
            name="fechaNacimiento">

        </div>


        <!-- Contraseña -->
        <div class="grupo">

            <label for="password">
                Contraseña
            </label>

            <input 
            type="password" 
            id="password" 
            name="password">

        </div>



        <!-- Botón Registrar -->
        <button 
        type="button" 
        onclick="ValidarDatos()">

            Registrar

        </button>



        <!-- Volver -->
        <div class="field">

            <div class="control">

                <a href="../restaurante 2/restaurante/index.html">

                    <button 
                    class="button is-light is-fullwidth" 
                    type="button">

                        Volver al inicio

                    </button>

                </a>

            </div>

        </div>


    </form>


</div>



<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- JavaScript del módulo -->
<script src="../restaurante 2/restaurante/JS/usuario.js"></script>


</body>

</html>
